services:
  - type: web
    name: econoapp-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://econoapp-web.onrender.com/?resetPassword=1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WHATSAPP_BOT_API_URL
        value: http://64.181.189.107:3001/econoapp
      - key: WHATSAPP_BOT_SEND_MESSAGE_PATH
        value: /send-message
      - key: WHATSAPP_ADMIN_PHONES
        value: 5511934736234
      - key: ADMIN_PANEL_LOGIN
        value: aleta0129
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: ADMIN_PANEL_USER_EMAIL
        value: keiohirakawa@gmail.com
      - key: WHATSAPP_WEBHOOK_TOKEN
        sync: false
      - key: WHATSAPP_BUDGET_ALERT_TOKEN
        generateValue: true
      - key: WHATSAPP_BUDGET_ALERT_INTERVAL_MINUTES
        value: 60
      - key: RECURRING_TRANSACTION_INTERVAL_MINUTES
        value: 60
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://econoapp-web.onrender.com,https://econoapp-admin.onrender.com

  - type: web
    name: econoapp-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_PORT
        value: 5173
      - key: WEB_API_URL
        value: https://econoapp-backend.onrender.com/api/v1
      - key: API_TARGET
        value: https://econoapp-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: econoapp-admin
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.admin
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_PORT
        value: 5174
      - key: WEB_API_URL
        value: https://econoapp-admin.onrender.com/api/v1
      - key: API_TARGET
        value: https://econoapp-backend.onrender.com

