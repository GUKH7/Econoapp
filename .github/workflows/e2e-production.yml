name: E2E WhatsApp (manual)

on:
  workflow_dispatch:
    inputs:
      run_outbound:
        description: Enviar uma mensagem real pelo WhatsApp
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  whatsapp-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BACKEND_URL: https://econoapp-backend.onrender.com
      E2E_ORACLE_URL: http://64.181.189.107:3001/econoapp
      E2E_WEBHOOK_TOKEN: ${{ secrets.E2E_WEBHOOK_TOKEN }}
      E2E_USER_PHONE: ${{ secrets.E2E_USER_PHONE }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_WHATSAPP_RECIPIENT: ${{ inputs.run_outbound && secrets.E2E_WHATSAPP_RECIPIENT || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate isolated E2E test configuration
        run: |
          for key in E2E_USER_PHONE E2E_USER_PASSWORD E2E_WEBHOOK_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing E2E configuration::${key} must be configured in GitHub Actions Secrets"
              exit 1
            fi
          done
          if [ "${{ inputs.run_outbound }}" = "true" ] && [ -z "$E2E_WHATSAPP_RECIPIENT" ]; then
            echo "::error title=Missing outbound recipient::E2E_WHATSAPP_RECIPIENT required for real WhatsApp sends"
            exit 1
          fi
      - name: Run production E2E
        run: npm run test:e2e:production
