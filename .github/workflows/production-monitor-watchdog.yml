name: Production availability watchdog (zero new cost)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-monitor-watchdog.mjs'
      - 'scripts/test-production-monitor-watchdog.mjs'
      - 'scripts/notify-watchdog-github.mjs'
      - 'scripts/test-notify-watchdog-github.mjs'
      - 'scripts/smoke-watchdog-notification.mjs'
      - '.github/workflows/production-monitor-watchdog.yml'
      - 'docs/runbooks/din-monitor-alerts.md'
  workflow_dispatch:
  schedule:
    # Two independent checks, offset from the /health cron; runs ONLY after merge.
    - cron: '17 4,16 * * *'

permissions:
  contents: read

concurrency:
  group: din-monitor-watchdog
  cancel-in-progress: false

jobs:
  tests:
    name: Simulated watchdog and notifier cases (no external access)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test normal, failure, disabled and missing schedules
        run: |
          node --check scripts/production-monitor-watchdog.mjs
          node --check scripts/notify-watchdog-github.mjs
          node --check scripts/smoke-watchdog-notification.mjs
          node --test scripts/test-production-monitor-watchdog.mjs scripts/test-notify-watchdog-github.mjs

  notification-smoke:
    name: GitHub bot mention smoke — draft PR #12 only
    needs: tests
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 12 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/din-monitoring-watchdog-no-cost-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send one harmless automated @mention, deduplicated
        run: node scripts/smoke-watchdog-notification.mjs

  watchdog:
    name: Missing or failed scheduled checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only GitHub schedule status and notify issue #5 on an actual alert
        run: node scripts/production-monitor-watchdog.mjs
