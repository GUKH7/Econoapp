name: Din external encrypted backup (opt-in)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BACKUP_REAL_DATA to authorize a live off-provider export'
        required: true
        type: string
  schedule:
    # Daily 05:37 UTC; this job stays SKIPPED until explicitly opted in.
    - cron: '37 5 * * *'

permissions:
  contents: read

concurrency:
  group: din-production-external-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted PostgreSQL export to external object storage
    if: >-
      ${{ vars.DIN_BACKUP_ENABLED == 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.confirm == 'BACKUP_REAL_DATA')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: din-external-backup
    env:
      DIN_BACKUP_LIVE_CONFIRM: BACKUP_REAL_DATA
      DIN_BACKUP_PGHOST: ${{ secrets.DIN_BACKUP_PGHOST }}
      DIN_BACKUP_PGUSER: ${{ secrets.DIN_BACKUP_PGUSER }}
      DIN_BACKUP_PGPASSWORD: ${{ secrets.DIN_BACKUP_PGPASSWORD }}
      DIN_BACKUP_PGDATABASE: ${{ secrets.DIN_BACKUP_PGDATABASE }}
      DIN_BACKUP_PGPORT: '5432'
      DIN_BACKUP_EXPECTED_PGHOST: ${{ secrets.DIN_BACKUP_EXPECTED_PGHOST }}
      DIN_BACKUP_AGE_RECIPIENT: ${{ vars.DIN_BACKUP_AGE_RECIPIENT }}
      DIN_BACKUP_S3_ENDPOINT: ${{ vars.DIN_BACKUP_S3_ENDPOINT }}
      DIN_BACKUP_S3_BUCKET: ${{ vars.DIN_BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DIN_BACKUP_STORAGE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DIN_BACKUP_STORAGE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - name: Install public encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Check tools
        run: |
          age --version
          docker --version
          aws --version
          docker pull postgres:18-alpine
      - name: Export encrypt upload verify object size
        run: bash scripts/backup-neon-external.sh
